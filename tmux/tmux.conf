source-file ~/.config/tmux/tmux.reset.conf

#Make terminals colourful
set -g default-terminal "tmux-256color"
# Enable true colour in iTerm2/Alacritty and other xterm-256color terminals
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"
set -s escape-time 0
set -g base-index 1

# vi key movement for copy/pasta mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

#plugin manager
set -g @plugin 'tmux-plugins/tpm'
#Vim motions
set -g @plugin 'christoomey/vim-tmux-navigator'
#Theme for powerline
set -g @plugin 'omerxx/catppuccin-tmux'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "date_time"
#set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_date_time_text "%H:%M"

# Set colors for the status line
set -g status-bg colour235
set -g status-fg white

# Customize the format of the window list
set -g window-status-format "#I:#W"

run '~/.tmux/plugins/tpm/tpm'
