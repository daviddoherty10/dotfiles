[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 10

decorations = "none"

#opacity = 0

#blur = true 

[font]
normal.family = "MesloLGS Nerd Font Mono"

size = 18

[cursor]
style = { shape = "Block", blinking = "On"}
blink_interval = 300
unfocused_hollow = true  # OptionalloLGS Nerd Font Mono"" makes cursor hollow when unfocused
blink_timeout = 255

[mouse]
hide_when_typing = true
