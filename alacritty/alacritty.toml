[general]
live_config_reload = true
import = ["catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
decorations = "None"
opacity = 1.0
option_as_alt = "OnlyLeft"

[font]
normal = { family = "MesloLGS Nerd Font Mono", style = "Regular" }
size = 18.0

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true

[mouse]
hide_when_typing = true
